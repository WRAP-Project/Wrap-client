components:
  schemas:
    AvailabilityResponseUpsertRequest:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlotRequest"
      required:
      - slots
    AvailabilitySlotRequest:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required:
      - endAt
      - startAt
    ApiResponseMyAvailabilityResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/MyAvailabilityResponse"
        message:
          type: string
        error:
          $ref: "#/components/schemas/ErrorBody"
    AvailabilitySlotResponse:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    BusySlotResponse:
      type: object
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        source:
          type: string
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
    MyAvailabilityResponse:
      type: object
      properties:
        availabilityRequestId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        slotUnitMinutes:
          type: integer
          format: int32
        existingBusySlots:
          type: array
          items:
            $ref: "#/components/schemas/BusySlotResponse"
        selectedAvailableSlots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlotResponse"
    ScheduleCreateRequest:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
