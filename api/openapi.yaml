  /projects/{projectId}/members/{projectMemberId}/work-role:
    patch:
      tags:
      - Project Member
      summary: 프로젝트 멤버 업무 역할 변경
      description: |
        진행 중인 프로젝트의 참여 중인(JOINED) OWNER가 참여 중인 팀원의 프로젝트별 업무 역할을 변경합니다.
        본인을 포함한 같은 프로젝트의 팀원만 변경할 수 있습니다.
        빈 문자열이나 공백만 입력하면 업무 역할 미지정(null) 상태로 변경됩니다.
        OWNER/MEMBER 관리 권한은 변경되지 않습니다.
        같은 프로젝트의 탈퇴·권한 변경·내보내기와 직렬화하여 처리 시점의 최신 참여 상태와 권한을 검사합니다.
      operationId: changeWorkRole
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: projectMemberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberWorkRoleUpdateRequest"
        required: true
      responses:
        "200":
          description: 프로젝트 멤버 업무 역할 변경 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "400":
          description: 입력값 검증 실패(VALIDATION_FAILED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "401":
          description: 로그인 필요(UNAUTHORIZED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "403":
          description: 참여 권한 없음(PROJECT_ACCESS_DENIED) 또는 OWNER 권한 필요(PROJECT_OWNER_REQUIRED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "404":
          description: 프로젝트 없음(PROJECT_NOT_FOUND) 또는 참여 중인 대상 멤버 없음(PROJECT_MEMBER_NOT_FOUND)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "409":
          description: 완료 프로젝트(PROJECT_ALREADY_COMPLETED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
  /projects/{projectId}/members/{projectMemberId}/role:
    patch:
      tags:
      - Project Member
      summary: 프로젝트 멤버 역할 변경
      description: |
        진행 중인 프로젝트의 참여 중인(JOINED) OWNER만 관리 권한을 변경할 수 있습니다.
        참여 중인 마지막 OWNER를 MEMBER로 변경할 수 없습니다.
        같은 프로젝트의 탈퇴·권한 변경·내보내기가 동시에 요청되어도 OWNER는 최소 한 명 유지됩니다.
        처리 시점의 최신 참여 상태와 권한을 기준으로 검사하므로 대기 중 권한을 잃으면 요청이 거부됩니다.
        업무 역할(workRole)이 아닌 OWNER/MEMBER 관리 권한을 변경합니다.
      operationId: changeRole
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: projectMemberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRoleUpdateRequest"
        required: true
      responses:
        "200":
          description: 프로젝트 멤버 권한 변경 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "400":
          description: 입력값 검증 실패(VALIDATION_FAILED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "401":
          description: 로그인 필요(UNAUTHORIZED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "403":
          description: 참여 권한 없음(PROJECT_ACCESS_DENIED) 또는 OWNER 권한 필요(PROJECT_OWNER_REQUIRED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "404":
          description: 프로젝트 없음(PROJECT_NOT_FOUND) 또는 참여 중인 대상 멤버 없음(PROJECT_MEMBER_NOT_FOUND)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
        "409":
          description: 마지막 OWNER의 권한 하향 불가(LAST_PROJECT_OWNER) 또는 완료 프로젝트(PROJECT_ALREADY_COMPLETED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectMemberResponse"
