openapi: 3.1.0
info:
  title: Wrap API
  description: Wrap project operation platform API documentation
  version: v1.0.0
servers:
- url: https://wrap-backend-ko54.onrender.com
  description: Generated server url
tags:
- name: Project
  description: 프로젝트 관련 API
- name: Availability
  description: Team availability request APIs
- name: Project Invite Link
  description: "프로젝트 초대 링크 생성, 조회, 비활성화 및 참여 API"
- name: Member
  description: 회원 관련 API
- name: Invitation
  description: 프로젝트 초대 관련 API
- name: Milestone
  description: 마일스톤 관련 API
- name: Project Member
  description: 프로젝트 멤버 관련 API
- name: Test API
  description: Swagger connection test API
paths:
  /projects/{projectId}/availability-requests/{availabilityRequestId}/me/response:
    get:
      tags:
      - Availability
      summary: Get my availability response
      operationId: findMyResponse
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: availabilityRequestId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyAvailabilityResponse"
    put:
      tags:
      - Availability
      summary: Submit my availability response
      operationId: upsertMyResponse
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: availabilityRequestId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityResponseUpsertRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMyAvailabilityResponse"
  /schedules:
    post:
      tags:
      - schedule-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleResponse"
  /projects:
    get:
      tags:
      - Project
      summary: 내 프로젝트 목록 조회
      description: |
        로그인한 사용자가 참여 중인(JOINED), 삭제되지 않은 프로젝트만 조회합니다.
        status를 생략하면 진행 중·완료 프로젝트를 모두 반환합니다.
        IN_PROGRESS는 진행 중, COMPLETED는 완료된 프로젝트만 반환합니다.
        상태 값은 대문자로 입력하며 지원하지 않는 값은 400 / INVALID_REQUEST를 반환합니다.
        조회 결과가 없으면 빈 목록을 반환합니다.
      operationId: getMyProjects
      parameters:
      - name: status
        in: query
        description: 프로젝트 진행 상태. 선택 값이며 생략 시 전체 상태 조회
        required: false
        schema:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
        example: IN_PROGRESS
      responses:
        "200":
          description: 내 프로젝트 목록 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectSummaryResponse"
        "400":
          description: 지원하지 않는 상태 값(INVALID_REQUEST)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectSummaryResponse"
        "401":
          description: 로그인 필요(UNAUTHORIZED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectSummaryResponse"
    post:
      tags:
      - Project
      summary: 프로젝트 생성
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
  /projects/{projectId}/milestones:
    get:
      tags:
      - Milestone
      summary: 마일스톤 목록 조회
      operationId: findProjectMilestones
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListMilestoneResponse"
    post:
      tags:
      - Milestone
      summary: 마일스톤 생성
      operationId: create_2
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMilestoneResponse"
  /projects/{projectId}/invite-links:
    get:
      tags:
      - Project Invite Link
      summary: 프로젝트 초대 링크 목록 조회
      description: |
        프로젝트에서 생성된 초대 링크 이력을 최신순으로 조회합니다.
        보안을 위해 원본 토큰과 전체 초대 URL은 반환하지 않습니다.
      operationId: getInviteLinks
      parameters:
      - name: projectId
        in: path
        description: 프로젝트 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      responses:
        "200":
          description: 초대 링크 목록 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectInviteLinkSummaryResponse"
        "401":
          description: 로그인이 필요함
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectInviteLinkSummaryResponse"
        "403":
          description: 프로젝트 접근 권한이 없거나 OWNER가 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectInviteLinkSummaryResponse"
        "404":
          description: 프로젝트를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListProjectInviteLinkSummaryResponse"
      security:
      - sessionAuth: []
    post:
      tags:
      - Project Invite Link
      summary: 프로젝트 초대 링크 생성
      description: |
        프로젝트 OWNER가 공유 가능한 초대 링크를 생성합니다.
        프로젝트당 하나의 활성 링크만 존재할 수 있으며,
        원본 초대 URL은 생성 성공 응답에서만 반환됩니다.
      operationId: create_3
      parameters:
      - name: projectId
        in: path
        description: 프로젝트 ID
        required: true
        schema:
          type: integer
          format: int64
        example: 10
      responses:
        "201":
          description: 초대 링크 생성 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
        "401":
          description: 로그인이 필요함
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
        "403":
          description: 프로젝트 접근 권한이 없거나 OWNER가 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
        "404":
          description: 프로젝트를 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
        "409":
          description: 활성 링크가 이미 존재하거나 프로젝트가 완료됨
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
        "500":
          description: 고유 토큰 생성 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteLinkResponse"
      security:
      - sessionAuth: []
  /projects/{projectId}/invitations:
    get:
      tags:
      - Invitation
      summary: 보낸 프로젝트 초대 목록 조회
      operationId: getSentInvitations
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListInvitationResponse"
    post:
      tags:
      - Invitation
      summary: 프로젝트 팀원 초대 생성
      operationId: create_4
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseInvitationResponse"
  /projects/{projectId}/availability-requests:
    get:
      tags:
      - Availability
      summary: List availability requests
      operationId: findAll
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CONFIRMED
          - CANCELED
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAvailabilityRequestSummaryResponse"
    post:
      tags:
      - Availability
      summary: Create availability request
      operationId: create_5
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequestCreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAvailabilityRequestDetailResponse"
  /projects/{projectId}/availability-requests/{availabilityRequestId}/confirm:
    post:
      tags:
      - Availability
      summary: Confirm availability request
      operationId: confirm
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: availabilityRequestId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityConfirmRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleResponse"
  /members/signup:
    post:
      tags:
      - Member
      summary: 회원가입
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberResponse"
  /members/logout:
    post:
      tags:
      - Member
      summary: 로그아웃
      operationId: logout
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /members/login:
    post:
      tags:
      - Member
      summary: 로그인
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMemberResponse"
  /invite-links/{token}/join:
    post:
      tags:
      - Project Invite Link
      summary: 초대 링크를 통한 프로젝트 참여
      description: |
        로그인한 사용자가 유효한 초대 링크를 통해 프로젝트에 참여합니다.
        신규 참여자와 재참여자의 역할은 MEMBER로 설정됩니다.
        이미 참여 중인 사용자는 중복으로 참여할 수 없습니다.
      operationId: join
      parameters:
      - name: token
        in: path
        description: 초대 URL에 포함된 원본 토큰
        required: true
        schema:
          type: string
        example: xYz123_exampleToken
      responses:
        "200":
          description: 프로젝트 참여 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteJoinResponse"
        "401":
          description: 로그인이 필요함
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteJoinResponse"
        "404":
          description: 링크 또는 활성 회원을 찾을 수 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteJoinResponse"
        "409":
          description: 프로젝트가 완료되었거나 이미 참여 중임
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectInviteJoinResponse"
      security:
      - sessionAuth: []
  /schedules/{scheduleId}:
    get:
      tags:
      - schedule-controller
      operationId: findDetail
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
    delete:
      tags:
      - schedule-controller
      operationId: delete
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    patch:
      tags:
      - schedule-controller
      operationId: update
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleResponse"
  /schedules/{scheduleId}/uncheck:
    patch:
      tags:
      - schedule-controller
      operationId: uncheck
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
  /schedules/{scheduleId}/check:
    patch:
      tags:
      - schedule-controller
      operationId: check
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScheduleDetailResponse"
  /projects/{projectId}:
    get:
      tags:
      - Project
      summary: 프로젝트 상세 조회
      description: |
        로그인한 사용자가 참여 중인(JOINED), 삭제되지 않은 프로젝트의 상세 정보를 반환합니다.
        myRole은 현재 요청자의 프로젝트 관리 권한(OWNER 또는 MEMBER)입니다.
        프로젝트 생성자의 권한이나 업무 역할(workRole)을 의미하지 않습니다.
        프론트의 버튼 표시 판단에 사용할 수 있으며 실제 API의 서버 권한 검사는 별도로 유지됩니다.
      operationId: getProject
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: 내 프로젝트 권한을 포함한 상세 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "401":
          description: 로그인 필요(UNAUTHORIZED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "403":
          description: 프로젝트 참여 권한 없음(PROJECT_ACCESS_DENIED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "404":
          description: 프로젝트가 없거나 삭제됨(PROJECT_NOT_FOUND)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
    delete:
      tags:
      - Project
      summary: 프로젝트 삭제
      operationId: delete_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
    patch:
      tags:
      - Project
      summary: 프로젝트 정보 부분 수정
      description: |
        로그인한 사용자 중 프로젝트에 참여 중인(JOINED) OWNER만 수정할 수 있습니다.
        모든 필드는 선택이며, 생략하거나 null을 보내면 기존 값을 유지합니다.
        description, goal, successCriteria는 빈 문자열 또는 공백만 보내면 내용을 삭제합니다.
        name과 color는 빈 문자열 또는 공백만 보낼 수 없습니다.
        날짜는 기존 값과 요청 값을 합쳐 시작일이 종료일보다 늦지 않은지 검증합니다.
        날짜는 null로 삭제할 수 없습니다. 빈 객체({})는 기존 정보를 유지합니다.
        완료된 프로젝트는 수정할 수 없으며 409 / PROJECT_ALREADY_COMPLETED를 반환합니다.
        수정하려면 먼저 PATCH /projects/{projectId}/reopen으로 프로젝트를 재개해야 합니다.
      operationId: update_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
        required: true
      responses:
        "200":
          description: 프로젝트 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "400":
          description: "입력값 검증 실패(VALIDATION_FAILED), 잘못된 요청(INVALID_REQUEST) 또는 날\
            짜 범위 오류(INVALID_DATE_RANGE)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "401":
          description: 로그인 필요(UNAUTHORIZED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "403":
          description: 프로젝트 참여 권한 없음(PROJECT_ACCESS_DENIED) 또는 OWNER 권한 필요(PROJECT_OWNER_REQUIRED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "404":
          description: 프로젝트가 없거나 삭제됨(PROJECT_NOT_FOUND)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
        "409":
          description: 완료된 프로젝트는 수정 불가(PROJECT_ALREADY_COMPLETED)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProjectResponse"
  /projects/{projectId}/tasks/{taskId}/status:
    patch:
      tags:
      - task-controller
      operationId: updateStatus
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStatusUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
