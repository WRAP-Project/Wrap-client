openapi: 3.1.0
info:
  title: Wrap API
  description: Wrap project operation platform API documentation
  version: v1.0.0
servers:
  - url: http://localhost:8080
    description: Generated server url
tags:
  - name: Member
    description: 회원 관련 API
  - name: Test API
    description: Swagger connection test API
paths:
  /schedules:
    post:
      tags:
        - schedule-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseScheduleResponse'
  /members/signup:
    post:
      tags:
        - Member
      summary: 회원가입
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMemberResponse'
  /members/logout:
    post:
      tags:
        - Member
      summary: 로그아웃
      operationId: logout
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /members/login:
    post:
      tags:
        - Member
      summary: 로그인
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMemberResponse'
  /schedules/{scheduleId}:
    delete:
      tags:
        - schedule-controller
      operationId: delete
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
    patch:
      tags:
        - schedule-controller
      operationId: update
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseScheduleResponse'
  /schedules/me:
    get:
      tags:
        - schedule-controller
      operationId: findMine
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: projectId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListScheduleResponse'
  /projects/{projectId}/schedules:
    get:
      tags:
        - schedule-controller
      operationId: findProjectSchedules
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListScheduleResponse'
  /projects/{projectId}/schedules/reminders:
    get:
      tags:
        - schedule-controller
      operationId: findReminders
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListScheduleReminderResponse'
  /api/test:
    get:
      tags:
        - Test API
      summary: Swagger test
      description: Checks whether Swagger and API routing are working.
      operationId: test
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    ScheduleCreateRequest:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shared:
          type: boolean
        validDateRange:
          type: boolean
      required:
        - endAt
        - startAt
        - title
    ApiResponseScheduleResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/ScheduleResponse'
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
    ScheduleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        creatorId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shared:
          type: boolean
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        nickname:
          type: string
          maxLength: 50
          minLength: 0
      required:
        - email
        - nickname
        - password
    ApiResponseMemberResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/MemberResponse'
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    MemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        nickname:
          type: string
        createdAt:
          type: string
          format: date-time
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ScheduleUpdateRequest:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shared:
          type: boolean
        validDateRange:
          type: boolean
    ApiResponseListScheduleResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleResponse'
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    ApiResponseListScheduleReminderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleReminderResponse'
        message:
          type: string
        error:
          $ref: '#/components/schemas/ErrorBody'
    ScheduleReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shared:
          type: boolean
        daysLeft:
          type: integer
          format: int64

