openapi: 3.1.0
info:
  title: Wrap API
  version: 0.1.0
  description: |
    Backend contract for the Wrap client.

    This file is the single source of truth for frontend-backend communication:
    - Backend engineers edit this file when an endpoint changes.
    - AI-assisted frontend changes are driven off this spec (request/response
      shapes, routes, status codes) rather than reading backend source directly.
    - Run `npm run docs:api` to render this into a human-readable page at
      `public/api-docs.html` for a quick visual review of the whole contract.
servers:
  - url: http://localhost:8080
    description: Local backend
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /projects:
    get:
      summary: 내 프로젝트 목록 조회
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: 프로젝트 생성
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 생성된 프로젝트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      summary: 프로젝트 상세 조회
      operationId: getProject
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 프로젝트 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProjectStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED]
    Project:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        successCriteria:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ProjectStatus"
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        goal:
          type: string
        successCriteria:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
